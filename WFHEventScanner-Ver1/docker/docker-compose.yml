services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: wfh-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/data/wfh_event.db
      BARCODE_OUTPUT_DIR: /app/data/output/barcodes
      INPUT_CSV: /app/data/input/WFHAttendees.csv
    volumes:
      - ../data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_EVENT_NAME: WFH Annual Event
    container_name: wfh-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: wfh-streamlit
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - ../data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
